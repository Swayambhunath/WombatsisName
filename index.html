<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data:; connect-src https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseapp.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Wer wird Wombatsi?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>👶 Wer wird Wombatsi?</h1>
  <nav>
    <button data-v="swipe" class="on">Swipen</button>
    <button data-v="mine">Meine</button>
    <button data-v="compare">Vergleich</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-swipe">
    <div>
      <div class="bar"><i id="prog"></i></div>
      <div class="meta"><span id="progTxt"></span><span id="countTxt"></span></div>
      <div class="packs" id="packs" role="tablist" aria-label="Namenspakete"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="actions">
      <button class="round" id="bNope" aria-label="Gefällt nicht">✖️</button>
      <button class="round sm" id="bUndo" aria-label="Zurück">↩︎</button>
      <button class="round" id="bLike" aria-label="Gefällt mir">💚</button>
    </div>
  </section>

  <section class="view" id="v-mine"><div class="scroll" id="mineBody"></div></section>

  <section class="view" id="v-compare"><div class="scroll">
    <div class="box">
      <div>Angemeldet als <b id="accountName"></b></div>
      <button class="btn ghost" id="btnLogout">Abmelden</button>
      <p class="hint" id="partnerStatus"></p>
    </div>
    <div id="result"></div>
  </div></section>
</main>

<section class="auth" id="auth" aria-label="Anmeldung">
  <form class="box" id="authForm">
    <h2 class="first">👶 Wer wird Wombatsi?</h2>
    <p class="hint">Wer bist du?</p>
    <div class="row who" id="who" role="radiogroup" aria-label="Benutzer">
      <button type="button" class="chip on" data-who="vroni" role="radio" aria-checked="true" aria-label="Vroni">V</button>
      <button type="button" class="chip" data-who="felix" role="radio" aria-checked="false" aria-label="Felix">F</button>
    </div>
    <label for="password">Passwort</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p class="msg" id="authMsg" role="alert"></p>
    <button class="btn wide" type="submit" id="btnLogin">Anmelden</button>
  </form>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="names.js"></script>
<script src="app.js"></script>
</body>
</html>
